<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Illustration of a ribbed knit beanie">
  <defs>
    <linearGradient id="washi-merch-beanie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="55%" stop-color="#ebe4d5"/>
      <stop offset="100%" stop-color="#e0d6c3"/>
    </linearGradient>
    <linearGradient id="knit-merch-beanie" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#263c5c"/>
      <stop offset="65%" stop-color="#18273d"/>
      <stop offset="100%" stop-color="#0f1826"/>
    </linearGradient>
    <pattern id="riso-merch-beanie" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-merch-beanie" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="89" result="noise">
        <animate attributeName="baseFrequency" values="0.014 0.022;0.018 0.028;0.014 0.022" dur="9s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-merch-beanie" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101827" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-merch-beanie)"/>

  <g filter="url(#pigment-drift-merch-beanie)" opacity="0.88">
    <ellipse cx="320" cy="245" rx="200" ry="140" fill="#1b304d" fill-opacity="0.15"/>
    <ellipse cx="360" cy="220" rx="140" ry="110" fill="#d1492f" fill-opacity="0.12"/>
  </g>

  <rect width="640" height="480" fill="url(#riso-merch-beanie)"/>

  <g stroke="#101827" stroke-opacity="0.18" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="432" rx="4"/>
    <path d="M24 62 H616 M24 418 H616"/>
  </g>

  <text x="40" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#101827" fill-opacity="0.65" letter-spacing="2">ARCHIVE // MERCH BEANIE — MERINO WATCH CAP</text>
  <text x="600" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#d1492f" letter-spacing="1.5">EDITION 04</text>

  <ellipse cx="320" cy="382" rx="158" ry="16" fill="#101827" fill-opacity="0.17"/>

  <g filter="url(#drop-merch-beanie)">
    <path d="M196 286 C192 148, 260 124, 320 124 C380 124, 448 148, 444 286 Z" fill="url(#knit-merch-beanie)" stroke="#101827" stroke-width="3"/>
    <path d="M226 266 C230 170, 280 140, 320 136 M262 268 C266 168, 296 140, 320 136 M298 268 L316 136 M342 268 L324 136 M378 268 C374 168, 344 140, 320 136 M414 266 C410 170, 360 140, 320 136" fill="none" stroke="#fcfbf8" stroke-opacity="0.22" stroke-width="4"/>
    <rect x="180" y="258" width="280" height="90" rx="14" fill="#1d2f47" stroke="#101827" stroke-width="3"/>
    <path d="M204 264 V342 M228 264 V342 M252 264 V342 M276 264 V342 M300 264 V342 M324 264 V342 M348 264 V342 M372 264 V342 M396 264 V342 M420 264 V342 M440 264 V342" stroke="#fcfbf8" stroke-opacity="0.24" stroke-width="4"/>
    <rect x="358" y="302" width="58" height="28" rx="2" fill="#d1492f" stroke="#fcfbf8" stroke-width="1.5"/>
    <text x="387" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" fill="#fcfbf8" letter-spacing="1">DINKUS</text>
  </g>

  <g transform="translate(528, 344)">
    <rect x="0" y="0" width="68" height="56" rx="4" fill="#fcfbf8" fill-opacity="0.9" stroke="#d1492f" stroke-width="2.2"/>
    <rect x="4" y="4" width="60" height="48" rx="2" fill="none" stroke="#d1492f" stroke-width="1" stroke-opacity="0.6"/>
    <text x="34" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#d1492f" letter-spacing="0.8">DINKUS //</text>
    <line x1="12" y1="29" x2="56" y2="29" stroke="#d1492f" stroke-width="1.2"/>
    <text x="34" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#d1492f" letter-spacing="1.5">STUDIO</text>
  </g>

  <text x="40" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#101827" fill-opacity="0.55" letter-spacing="1.5">DINKUS // STUDIO · MERCH ARCHIVE PLATE 04</text>
</svg>