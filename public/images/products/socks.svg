<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Ribbed Socks — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-socks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="55%" stop-color="#eae3d4"/>
      <stop offset="100%" stop-color="#dfd6c3"/>
    </linearGradient>
    <linearGradient id="knit-socks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcf9f2"/>
      <stop offset="100%" stop-color="#ded5c3"/>
    </linearGradient>
    <pattern id="riso-socks" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-socks" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="67" result="noise">
        <animate attributeName="baseFrequency" values="0.014 0.022;0.018 0.028;0.014 0.022" dur="9s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-socks" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101827" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-socks)"/>

  <g filter="url(#pigment-drift-socks)" opacity="0.88">
    <ellipse cx="315" cy="240" rx="190" ry="145" fill="#1b304d" fill-opacity="0.15"/>
    <ellipse cx="370" cy="275" rx="145" ry="110" fill="#d1492f" fill-opacity="0.12"/>
  </g>

  <rect width="640" height="480" fill="url(#riso-socks)"/>

  <g stroke="#101827" stroke-opacity="0.18" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="432" rx="4"/>
    <path d="M24 62 H616 M24 418 H616"/>
  </g>

  <text x="40" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#101827" fill-opacity="0.65" letter-spacing="2">CAT // 06 — SLUB RIBBED CREW SOCKS</text>
  <text x="600" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#d1492f" letter-spacing="1.5">COMBED COTTON · PAIR</text>

  <ellipse cx="320" cy="396" rx="148" ry="15" fill="#101827" fill-opacity="0.16"/>

  <g filter="url(#drop-socks)">
    <g transform="translate(-34, -10)">
      <path d="M270 104 H346 V268 L412 318 C432 334, 418 368, 390 364 L276 336 C256 330, 254 306, 270 284 Z" fill="#e5decb" stroke="#101827" stroke-width="3" stroke-linejoin="round"/>
      <rect x="270" y="122" width="76" height="10" fill="#d1492f"/>
      <rect x="270" y="138" width="76" height="10" fill="#172438"/>
    </g>
    <g transform="translate(22, 8)">
      <path d="M250 104 H330 V268 L404 322 C426 338, 410 374, 380 368 L258 338 C236 332, 236 302, 250 280 Z" fill="url(#knit-socks)" stroke="#101827" stroke-width="3" stroke-linejoin="round"/>
      <rect x="250" y="122" width="80" height="11" fill="#d1492f"/>
      <rect x="250" y="139" width="80" height="11" fill="#172438"/>
      <path d="M250 280 C282 280, 294 312, 274 342 L258 338 C236 332, 236 302, 250 280 Z" fill="#172438"/>
      <path d="M368 296 L404 322 C426 338, 410 374, 380 368 L350 360 C352 332, 358 312, 368 296 Z" fill="#172438"/>
      <path d="M266 160 V268 M282 160 V274 M298 160 V278 M314 160 V274" stroke="#101827" stroke-opacity="0.22" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(528, 344)">
    <rect x="0" y="0" width="68" height="56" rx="4" fill="#fcfbf8" fill-opacity="0.9" stroke="#d1492f" stroke-width="2.2"/>
    <rect x="4" y="4" width="60" height="48" rx="2" fill="none" stroke="#d1492f" stroke-width="1" stroke-opacity="0.6"/>
    <text x="34" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#d1492f" letter-spacing="0.8">DINKUS //</text>
    <line x1="12" y1="29" x2="56" y2="29" stroke="#d1492f" stroke-width="1.2"/>
    <text x="34" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#d1492f" letter-spacing="1.5">STUDIO</text>
  </g>

  <text x="40" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#101827" fill-opacity="0.55" letter-spacing="1.5">DINKUS // STUDIO · PIGMENT DRIFT RISOGRAPH PLATE 06</text>
</svg>
