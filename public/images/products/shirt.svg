<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Heavyweight T-Shirt — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="55%" stop-color="#ece5d8"/>
      <stop offset="100%" stop-color="#e2d9c8"/>
    </linearGradient>
    <linearGradient id="garment-shirt" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#22334d"/>
      <stop offset="50%" stop-color="#172438"/>
      <stop offset="100%" stop-color="#0f1826"/>
    </linearGradient>
    <pattern id="riso-shirt" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-shirt" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-shirt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101827" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-shirt)"/>

