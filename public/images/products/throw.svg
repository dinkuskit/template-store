<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Woven Throw — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-throw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="55%" stop-color="#ebe4d5"/>
      <stop offset="100%" stop-color="#dfd6c3"/>
    </linearGradient>
    <linearGradient id="weave-throw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223654"/>
      <stop offset="100%" stop-color="#132033"/>
    </linearGradient>
    <pattern id="riso-throw" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-throw" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="97" result="noise">
        <animate attributeName="baseFrequency" values="0.014 0.022;0.018 0.028;0.014 0.022" dur="9s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-throw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101827" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-throw)"/>

  <g filter="url(#pigment-drift-throw)" opacity="0.88">
    <ellipse cx="320" cy="245" rx="205" ry="140" fill="#1b304d" fill-opacity="0.15"/>
    <ellipse cx="275" cy="215" rx="150" ry="110" fill="#d1492f" fill-opacity="0.12"/>
  </g>

  <rect width="640" height="480" fill="url(#riso-throw)"/>

  <g stroke="#101827" stroke-opacity="0.18" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="432" rx="4"/>
    <path d="M24 62 H616 M24 418 H616"/>
  </g>

  <text x="40" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#101827" fill-opacity="0.65" letter-spacing="2">CAT // 09 — JACQUARD WOVEN THROW</text>
  <text x="600" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#d1492f" letter-spacing="1.5">SASHIKO LOOM · FRINGED</text>

  <ellipse cx="320" cy="396" rx="168" ry="16" fill="#101827" fill-opacity="0.16"/>

  <g filter="url(#drop-throw)">
    <rect x="164" y="286" width="312" height="62" rx="14" fill="#e8e0cf" stroke="#101827" stroke-width="3"/>
    <rect x="176" y="224" width="288" height="72" rx="14" fill="url(#weave-throw)" stroke="#101827" stroke-width="3"/>
    <rect x="192" y="156" width="256" height="78" rx="14" fill="#d1492f" stroke="#101827" stroke-width="3"/>
    <rect x="216" y="172" width="208" height="46" rx="6" fill="#fcfbf8" stroke="#101827" stroke-width="2"/>
    <path d="M236 195 H404 M260 183 L248 207 M290 183 L278 207 M320 183 L308 207 M350 183 L338 207 M380 183 L368 207" stroke="#172438" stroke-width="2.5"/>
    <path d="M196 250 H444 M196 270 H444" stroke="#fcfbf8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 5"/>
    <g stroke="#101827" stroke-width="2.5" stroke-linecap="round">
      <path d="M180 348 L174 378 M198 348 L194 380 M216 348 L212 378 M234 348 L232 380 M252 348 L250 378 M270 348 L268 380 M288 348 L286 378 M306 348 L306 380 M324 348 L324 378 M342 348 L344 380 M360 348 L362 378 M378 348 L382 380 M396 348 L400 378 M414 348 L418 380 M432 348 L438 378 M450 348 L456 380"/>
    </g>
  </g>

  <g transform="translate(528, 344)">
    <rect x="0" y="0" width="68" height="56" rx="4" fill="#fcfbf8" fill-opacity="0.9" stroke="#d1492f" stroke-width="2.2"/>
    <rect x="4" y="4" width="60" height="48" rx="2" fill="none" stroke="#d1492f" stroke-width="1" stroke-opacity="0.6"/>
    <text x="34" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#d1492f" letter-spacing="0.8">DINKUS //</text>
    <line x1="12" y1="29" x2="56" y2="29" stroke="#d1492f" stroke-width="1.2"/>
    <text x="34" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#d1492f" letter-spacing="1.5">STUDIO</text>
  </g>

  <text x="40" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#101827" fill-opacity="0.55" letter-spacing="1.5">DINKUS // STUDIO · PIGMENT DRIFT RISOGRAPH PLATE 09</text>
</svg>
