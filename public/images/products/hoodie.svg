<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Everyday Hoodie — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f0e6"/>
      <stop offset="55%" stop-color="#e8e2d5"/>
      <stop offset="100%" stop-color="#ddd5c4"/>
    </linearGradient>
    <linearGradient id="garment-hoodie" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2c4263"/>
      <stop offset="55%" stop-color="#1b2b44"/>
      <stop offset="100%" stop-color="#111b2c"/>
    </linearGradient>
    <pattern id="riso-hoodie" width="8" height="8" patternUnits="userSpaceOnUse">
