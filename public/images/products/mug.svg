<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Ceramic Mug — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-mug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e7"/>
      <stop offset="55%" stop-color="#ebe4d5"/>
      <stop offset="100%" stop-color="#dfd6c4"/>
    </linearGradient>
    <linearGradient id="glaze-mug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a4060"/>
      <stop offset="55%" stop-color="#19283e"/>
      <stop offset="100%" stop-color="#101928"/>
    </linearGradient>
    <pattern id="riso-mug" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-mug" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="41" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-mug" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101827" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-mug)"/>

  <g filter="url(#pigment-drift-mug)" opacity="0.9">
    <ellipse cx="305" cy="250" rx="185" ry="135" fill="#1d324f" fill-opacity="0.15"/>
    <ellipse cx="350" cy="195" rx="130" ry="105" fill="#d1492f" fill-opacity="0.12"/>
    <path d="M275 155 C260 125, 290 105, 275 78 M315 150 C300 118, 332 98, 316 68 M352 158 C340 130, 365 112, 352 86" fill="none" stroke="#d1492f" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect width="640" height="480" fill="url(#riso-mug)"/>

  <g stroke="#101827" stroke-opacity="0.18" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="432" rx="4"/>
    <path d="M24 62 H616 M24 418 H616"/>
  </g>

  <text x="40" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#101827" fill-opacity="0.65" letter-spacing="2">CAT // 04 — STONEWARE STUDIO MUG</text>
  <text x="600" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#d1492f" letter-spacing="1.5">12 OZ · KILN GLAZE</text>

  <ellipse cx="306" cy="390" rx="132" ry="16" fill="#101827" fill-opacity="0.18"/>

  <g filter="url(#drop-mug)">
    <path d="M392 214 H434 C464 214, 468 312, 432 312 H388" fill="none" stroke="#19283e" stroke-width="18" stroke-linecap="round"/>
    <path d="M392 214 H434 C464 214, 468 312, 432 312 H388" fill="none" stroke="#101827" stroke-width="3"/>
    <path d="M214 182 H398 L386 356 C384 372, 228 372, 226 356 Z" fill="url(#glaze-mug)" stroke="#101827" stroke-width="3" stroke-linejoin="round"/>
    <path d="M214 182 H398 L395 224 C355 236, 255 216, 217 228 Z" fill="#f3ede0" stroke="#101827" stroke-width="2.5"/>
    <path d="M226 346 C268 354, 344 354, 386 346 L383 366 C344 376, 268 376, 229 366 Z" fill="#c97a53" stroke="#101827" stroke-width="2.5"/>
    <ellipse cx="306" cy="182" rx="92" ry="18" fill="#dfd7c6" stroke="#101827" stroke-width="3"/>
    <ellipse cx="306" cy="184" rx="80" ry="12" fill="#3a2319"/>
    <rect x="288" y="264" width="36" height="36" rx="4" fill="#d1492f" stroke="#fcfbf8" stroke-width="1.8"/>
    <text x="306" y="287" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" fill="#fcfbf8">DK</text>
  </g>

  <g transform="translate(528, 344)">
    <rect x="0" y="0" width="68" height="56" rx="4" fill="#fcfbf8" fill-opacity="0.9" stroke="#d1492f" stroke-width="2.2"/>
    <rect x="4" y="4" width="60" height="48" rx="2" fill="none" stroke="#d1492f" stroke-width="1" stroke-opacity="0.6"/>
    <text x="34" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#d1492f" letter-spacing="0.8">DINKUS //</text>
    <line x1="12" y1="29" x2="56" y2="29" stroke="#d1492f" stroke-width="1.2"/>
    <text x="34" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#d1492f" letter-spacing="1.5">STUDIO</text>
  </g>

  <text x="40" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#101827" fill-opacity="0.55" letter-spacing="1.5">DINKUS // STUDIO · PIGMENT DRIFT RISOGRAPH PLATE 04</text>
</svg>
