<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Steel Bottle — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="55%" stop-color="#ebe4d5"/>
      <stop offset="100%" stop-color="#dfd6c3"/>
    </linearGradient>
    <linearGradient id="flask-bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#142033"/>
      <stop offset="32%" stop-color="#2c4466"/>
      <stop offset="68%" stop-color="#1b2b44"/>
      <stop offset="100%" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="riso-bottle" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-bottle" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="83" result="noise">
        <animate attributeName="baseFrequency" values="0.014 0.022;0.018 0.028;0.014 0.022" dur="9s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-bottle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101827" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-bottle)"/>

  <g filter="url(#pigment-drift-bottle)" opacity="0.88">
    <ellipse cx="320" cy="240" rx="175" ry="155" fill="#1b304d" fill-opacity="0.15"/>
    <ellipse cx="355" cy="220" rx="130" ry="125" fill="#d1492f" fill-opacity="0.12"/>
  </g>

  <rect width="640" height="480" fill="url(#riso-bottle)"/>

  <g stroke="#101827" stroke-opacity="0.18" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="432" rx="4"/>
    <path d="M24 62 H616 M24 418 H616"/>
  </g>

  <text x="40" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#101827" fill-opacity="0.65" letter-spacing="2">CAT // 08 — INSULATED STEEL FLASK</text>
  <text x="600" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#d1492f" letter-spacing="1.5">750 ML · DOUBLE WALL</text>

  <ellipse cx="320" cy="400" rx="92" ry="14" fill="#101827" fill-opacity="0.18"/>

  <g filter="url(#drop-bottle)">
    <path d="M294 102 V76 C294 60, 346 60, 346 76 V102" fill="none" stroke="#101827" stroke-width="7" stroke-linecap="round"/>
    <rect x="288" y="96" width="64" height="30" rx="4" fill="#d1492f" stroke="#101827" stroke-width="3"/>
    <rect x="292" y="126" width="56" height="16" fill="#d8d2c5" stroke="#101827" stroke-width="2.5"/>
    <path d="M292 142 L262 182 V378 C262 390, 378 390, 378 378 V182 L348 142 Z" fill="url(#flask-bottle)" stroke="#101827" stroke-width="3" stroke-linejoin="round"/>
    <path d="M262 354 H378" stroke="#d1492f" stroke-width="5"/>
    <line x1="286" y1="192" x2="286" y2="342" stroke="#fcfbf8" stroke-opacity="0.26" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#fcfbf8" stroke-opacity="0.55" stroke-width="1.5">
      <line x1="344" y1="210" x2="358" y2="210"/>
      <line x1="348" y1="235" x2="358" y2="235"/>
      <line x1="344" y1="260" x2="358" y2="260"/>
      <line x1="348" y1="285" x2="358" y2="285"/>
      <line x1="344" y1="310" x2="358" y2="310"/>
    </g>
    <text x="320" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" fill="#fcfbf8" letter-spacing="2">DINKUS</text>
  </g>

  <g transform="translate(528, 344)">
    <rect x="0" y="0" width="68" height="56" rx="4" fill="#fcfbf8" fill-opacity="0.9" stroke="#d1492f" stroke-width="2.2"/>
    <rect x="4" y="4" width="60" height="48" rx="2" fill="none" stroke="#d1492f" stroke-width="1" stroke-opacity="0.6"/>
    <text x="34" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#d1492f" letter-spacing="0.8">DINKUS //</text>
    <line x1="12" y1="29" x2="56" y2="29" stroke="#d1492f" stroke-width="1.2"/>
    <text x="34" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#d1492f" letter-spacing="1.5">STUDIO</text>
  </g>

  <text x="40" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#101827" fill-opacity="0.55" letter-spacing="1.5">DINKUS // STUDIO · PIGMENT DRIFT RISOGRAPH PLATE 08</text>
</svg>
