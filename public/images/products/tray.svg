<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Catchall Tray — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="55%" stop-color="#ebe4d6"/>
      <stop offset="100%" stop-color="#e0d6c4"/>
    </linearGradient>
    <linearGradient id="surface-tray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#253a59"/>
      <stop offset="100%" stop-color="#131f33"/>
    </linearGradient>
    <pattern id="riso-tray" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-tray" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="53" result="noise">
        <animate attributeName="baseFrequency" values="0.014 0.022;0.018 0.028;0.014 0.022" dur="9s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-tray" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#101827" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-tray)"/>

  <g filter="url(#pigment-drift-tray)" opacity="0.88">
    <ellipse cx="320" cy="248" rx="210" ry="130" fill="#1b304d" fill-opacity="0.14"/>
    <ellipse cx="265" cy="220" rx="145" ry="100" fill="#d1492f" fill-opacity="0.12"/>
  </g>

  <rect width="640" height="480" fill="url(#riso-tray)"/>

  <g stroke="#101827" stroke-opacity="0.18" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="432" rx="4"/>
    <path d="M24 62 H616 M24 418 H616"/>
  </g>

  <text x="40" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#101827" fill-opacity="0.65" letter-spacing="2">CAT // 05 — MOLDED VALET CATCHALL TRAY</text>
  <text x="600" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#d1492f" letter-spacing="1.5">BRASS RIVETED</text>

  <g filter="url(#drop-tray)">
    <polygon points="320,124 516,222 320,356 124,222" fill="url(#surface-tray)" stroke="#101827" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="124,222 320,356 320,382 124,248" fill="#101827" stroke="#101827" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="516,222 320,356 320,382 516,248" fill="#1b2a42" stroke="#101827" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="320,152 472,226 320,324 168,226" fill="#f3ede0" stroke="#101827" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="320,164 452,228 320,310 188,228" fill="none" stroke="#d1492f" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="320" cy="140" r="5" fill="#d1492f" stroke="#fcfbf8" stroke-width="1.5"/>
    <circle cx="490" cy="224" r="5" fill="#d1492f" stroke="#fcfbf8" stroke-width="1.5"/>
    <circle cx="320" cy="340" r="5" fill="#d1492f" stroke="#fcfbf8" stroke-width="1.5"/>
    <circle cx="150" cy="224" r="5" fill="#d1492f" stroke="#fcfbf8" stroke-width="1.5"/>
    <rect x="278" y="212" width="84" height="32" rx="4" fill="none" stroke="#101827" stroke-opacity="0.55" stroke-width="1.8"/>
    <text x="320" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" fill="#101827" letter-spacing="2">DINKUS</text>
  </g>

  <g transform="translate(528, 344)">
    <rect x="0" y="0" width="68" height="56" rx="4" fill="#fcfbf8" fill-opacity="0.9" stroke="#d1492f" stroke-width="2.2"/>
    <rect x="4" y="4" width="60" height="48" rx="2" fill="none" stroke="#d1492f" stroke-width="1" stroke-opacity="0.6"/>
    <text x="34" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#d1492f" letter-spacing="0.8">DINKUS //</text>
    <line x1="12" y1="29" x2="56" y2="29" stroke="#d1492f" stroke-width="1.2"/>
    <text x="34" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#d1492f" letter-spacing="1.5">STUDIO</text>
  </g>

  <text x="40" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#101827" fill-opacity="0.55" letter-spacing="1.5">DINKUS // STUDIO · PIGMENT DRIFT RISOGRAPH PLATE 05</text>
</svg>
