<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dinkus Demo Canvas Tote — Aizome pigment wash illustration">
  <defs>
    <linearGradient id="washi-tote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2e9"/>
      <stop offset="55%" stop-color="#ebe4d6"/>
      <stop offset="100%" stop-color="#dfd6c5"/>
    </linearGradient>
    <linearGradient id="canvas-tote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcf9f2"/>
      <stop offset="65%" stop-color="#ede6d6"/>
      <stop offset="100%" stop-color="#dcd2be"/>
    </linearGradient>
    <pattern id="riso-tote" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#101827" fill-opacity="0.08"/>
      <circle cx="6" cy="6" r="0.65" fill="#d1492f" fill-opacity="0.07"/>
    </pattern>
    <filter id="pigment-drift-tote" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="3" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="drop-tote" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101827" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#washi-tote)"/>

  <g filter="url(#pigment-drift-tote)" opacity="0.88">
    <ellipse cx="315" cy="245" rx="190" ry="145" fill="#1b304d" fill-opacity="0.15"/>
    <ellipse cx="380" cy="210" rx="135" ry="110" fill="#d1492f" fill-opacity="0.12"/>
    <circle cx="235" cy="290" r="95" fill="#233b5c" fill-opacity="0.1"/>
  </g>

  <rect width="640" height="480" fill="url(#riso-tote)"/>

  <g stroke="#101827" stroke-opacity="0.18" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="432" rx="4"/>
    <path d="M24 62 H616 M24 418 H616"/>
  </g>

  <text x="40" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#101827" fill-opacity="0.65" letter-spacing="2">CAT // 03 — 18OZ DUCK CANVAS TOTE</text>
  <text x="600" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#d1492f" letter-spacing="1.5">REINFORCED WEBBING</text>

  <ellipse cx="320" cy="398" rx="135" ry="15" fill="#101827" fill-opacity="0.16"/>

  <g filter="url(#drop-tote)">
    <path d="M262 175 V105 C262 72, 378 72, 378 105 V175" fill="none" stroke="#172438" stroke-width="18" stroke-linecap="butt"/>
    <path d="M206 168 H434 L416 382 C360 390, 280 390, 224 382 Z" fill="url(#canvas-tote)" stroke="#101827" stroke-width="3" stroke-linejoin="round"/>
    <path d="M219 338 H421 L416 382 C360 390, 280 390, 224 382 Z" fill="#172438" stroke="#101827" stroke-width="2.5"/>
    <rect x="253" y="168" width="18" height="170" fill="#172438"/>
    <rect x="369" y="168" width="18" height="170" fill="#172438"/>
    <g stroke="#d1492f" stroke-width="1.8" fill="none">
      <rect x="255" y="174" width="14" height="22"/>
      <path d="M255 174 L269 196 M269 174 L255 196"/>
      <rect x="371" y="174" width="14" height="22"/>
      <path d="M371 174 L385 196 M385 174 L371 196"/>
    </g>
    <rect x="278" y="216" width="84" height="86" rx="3" fill="#f7f3e8" stroke="#101827" stroke-width="2"/>
    <circle cx="320" cy="252" r="18" fill="#d1492f"/>
    <path d="M294 282 H346 M302 291 H338" stroke="#101827" stroke-width="2.2"/>
  </g>

  <g transform="translate(528, 344)">
    <rect x="0" y="0" width="68" height="56" rx="4" fill="#fcfbf8" fill-opacity="0.9" stroke="#d1492f" stroke-width="2.2"/>
    <rect x="4" y="4" width="60" height="48" rx="2" fill="none" stroke="#d1492f" stroke-width="1" stroke-opacity="0.6"/>
    <text x="34" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="800" fill="#d1492f" letter-spacing="0.8">DINKUS //</text>
    <line x1="12" y1="29" x2="56" y2="29" stroke="#d1492f" stroke-width="1.2"/>
    <text x="34" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#d1492f" letter-spacing="1.5">STUDIO</text>
  </g>

  <text x="40" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#101827" fill-opacity="0.55" letter-spacing="1.5">DINKUS // STUDIO · PIGMENT DRIFT RISOGRAPH PLATE 03</text>
</svg>
