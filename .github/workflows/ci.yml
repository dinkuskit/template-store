name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck='' -pyflakes=''

  verify:
    name: Store verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Capture browser failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-browser-error-context-${{ github.run_id }}
          path: |
            test-results/playwright/**/error-context.md
            test-results/playwright/**/home-editor-fixture-state.json
          if-no-files-found: ignore
          retention-days: 3

  deploy-playground:
    name: Playground deployment
    needs: verify
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:playground-config
      - run: pnpm exec astro build --config astro.playground.config.mjs
      - name: Record source commits
        id: commits
        shell: bash
        run: |
          set -euo pipefail
          commerce_commit="$(node --input-type=module -e \
            "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json','utf8')).dinkuskit.sourcePins.commerce.commit)")"
          template_commit="${GITHUB_SHA}"
          message="template-store=${template_commit} commerce=${commerce_commit}"
          echo "message=${message}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Playground source commits::${message}"
      - name: Upload PR preview version
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAYGROUND_API_TOKEN }}
        run: >-
          pnpm exec wrangler versions upload
          --config wrangler.playground.jsonc
          --preview-alias pr-${{ github.event.pull_request.number }}
          --message "${{ steps.commits.outputs.message }}"
      - name: Verify PR preview
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.playground.dinkuskit.com
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors \
            --retry-delay 5 --dump-header "$headers" "$PREVIEW_URL/" --output "$body"
          grep -Eiq '^x-robots-tag:.*noindex' "$headers"
          grep -Eiq 'name=["'\"']robots["'\"'].*noindex|noindex.*name=["'\"']robots["'\"']' "$body"
          checkout_body="$(mktemp)"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors \
            --retry-delay 5 "$PREVIEW_URL/checkout" --output "$checkout_body"
          grep -Fqi "Checkout unavailable" "$checkout_body"
      - name: Deploy main playground
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAYGROUND_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --config wrangler.playground.jsonc
          --message "${{ steps.commits.outputs.message }}"
