name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow validation
    # Closed PR events only run preview cleanup (cleanup-playground-preview).
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck='' -pyflakes=''

  verify:
    name: Store verification
    # Closed PR events only run preview cleanup (cleanup-playground-preview).
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Capture browser failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-browser-error-context-${{ github.run_id }}
          path: |
            test-results/playwright/**/error-context.md
            test-results/playwright/**/home-editor-fixture-state.json
          if-no-files-found: ignore
          retention-days: 3

  build-playground:
    name: Playground build
    needs: verify
    # Closed PR events only run preview cleanup (cleanup-playground-preview).
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:playground-config
      - run: pnpm prepare:sources
      - run: pnpm exec astro build --config astro.playground.config.mjs
      - name: Remove unused Astro session binding
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "dist/server/wrangler.json";
          const config = JSON.parse(readFileSync(path, "utf8"));
          let changed = false;
          for (const section of [config, config.previews]) {
            const bindings = section?.kv_namespaces;
            if (!Array.isArray(bindings)) continue;
            const filtered = bindings.filter(({ binding }) => binding !== "SESSION");
            changed ||= filtered.length !== bindings.length;
            section.kv_namespaces = filtered;
          }
          if (changed) {
            writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          }
          if ([config, config.previews].some((section) =>
            section?.kv_namespaces?.some(({ binding }) => binding === "SESSION")
          )) {
            throw new Error("Generated playground Wrangler config still contains SESSION.");
          }
          NODE

  # Cloudflare uploads stay off until the owner approves the one-time
  # Cloudflare setup and sets the PLAYGROUND_DEPLOY_ENABLED variable. The
  # token lives only in the `playground` environment. By the owner's choice
  # (2026-10-10) that environment has no required reviewer: pushes to main
  # deploy on their own, same-repository pull requests get preview links on
  # their own unless labeled verification-only; fork pull requests never run
  # this job. Verification-only PRs also skip preview cleanup. Preview URLs use
  # Cloudflare Worker Previews on pr-N.playground.dinkuskit.com.
  deploy-playground:
    name: Playground deployment
    needs: build-playground
    if: >-
      vars.PLAYGROUND_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
      (github.event.action != 'closed' &&
      !contains(github.event.pull_request.labels.*.name, 'verification-only') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    environment: playground
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:playground-config
      - run: pnpm prepare:sources
      - run: pnpm exec astro build --config astro.playground.config.mjs
      - name: Remove unused Astro session binding
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "dist/server/wrangler.json";
          const config = JSON.parse(readFileSync(path, "utf8"));
          let changed = false;
          for (const section of [config, config.previews]) {
            const bindings = section?.kv_namespaces;
            if (!Array.isArray(bindings)) continue;
            const filtered = bindings.filter(({ binding }) => binding !== "SESSION");
            changed ||= filtered.length !== bindings.length;
            section.kv_namespaces = filtered;
          }
          if (changed) {
            writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          }
          if ([config, config.previews].some((section) =>
            section?.kv_namespaces?.some(({ binding }) => binding === "SESSION")
          )) {
            throw new Error("Generated playground Wrangler config still contains SESSION.");
          }
          NODE
      - name: Record source commits
        id: commits
        shell: bash
        run: |
          set -euo pipefail
          commerce_commit="$(node --input-type=module -e \
            "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json','utf8')).dinkuskit.sourcePins.commerce.commit)")"
          message="template-store=${SOURCE_SHA} commerce=${commerce_commit}"
          echo "message=${message}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Playground source commits::${message}"
      - name: Publish PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAYGROUND_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          preview_json="$(mktemp)"
          pnpm exec wrangler preview \
            --config dist/server/wrangler.json \
            --name "pr-${{ github.event.pull_request.number }}" \
            --message "${{ steps.commits.outputs.message }}" \
            --json > "$preview_json"
          # wrangler can print banner/warning lines before the JSON; keep only the JSON document.
          sed -n '/^[[:space:]]*[{[]/,$p' "$preview_json" > "${preview_json}.clean"
          if ! preview_url="$(jq -er '.preview.urls[0] // .urls[0] // .preview_url // .url' "${preview_json}.clean")"; then
            echo "::error title=Unparseable wrangler preview output::$(head -c 2000 "$preview_json" | tr '\n' ' ')"
            exit 1
          fi
          expected_url="https://pr-${{ github.event.pull_request.number }}.playground.dinkuskit.com"
          test "$preview_url" = "$expected_url"
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Playground preview::${preview_url}"
      - name: Verify PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          # /playground starts an EmDash playground session cookie; reuse it for /cart.
          cookie_jar="$(mktemp)"
          # The root redirects to /playground; follow it and require a final 200.
          result="$(curl --silent --show-error --location --retry 12 --retry-all-errors \
            --retry-delay 5 --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
            --dump-header "$headers" --output "$body" \
            --write-out '%{http_code} %{url_effective}' "$PREVIEW_URL/")"
          read -r final_status final_url <<< "$result"
          # Headers of the final response only (last header block after redirects).
          final_robots="$(awk 'BEGIN{IGNORECASE=1} /^HTTP\//{r=""} tolower($0) ~ /^x-robots-tag:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); r=$0} END{print r}' "$headers")"
          {
            echo "### Playground preview proof"
            echo ""
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Commit | \`${SOURCE_SHA}\` |"
            echo "| Requested | ${PREVIEW_URL}/ |"
            echo "| Final URL | ${final_url} |"
            echo "| Final status | ${final_status} |"
            echo "| X-Robots-Tag | ${final_robots} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Playground preview proof::${SOURCE_SHA} ${PREVIEW_URL}/ -> ${final_url} status=${final_status} x-robots-tag='${final_robots}'"
          test "$final_status" = "200"
          test "$final_url" = "${PREVIEW_URL}/playground"
          echo "$final_robots" | grep -Eiq '(^|[ ,])noindex([ ,]|$)'
          echo "$final_robots" | grep -Eiq '(^|[ ,])nofollow([ ,]|$)'
          grep -Eiq 'name=["'\"']robots["'\"'].*noindex|noindex.*name=["'\"']robots["'\"']' "$body"
          # The playground has no /checkout page; the cart shows checkout as unavailable.
          cart_body="$(mktemp)"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors \
            --retry-delay 5 --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
            "$PREVIEW_URL/cart" --output "$cart_body"
          grep -Fqi "Checkout unavailable" "$cart_body"
          # Each visitor DB must list the seeded demo catalog (not the fallback).
          home_body="$(mktemp)"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors \
            --retry-delay 5 --cookie-jar "$cookie_jar" --cookie "$cookie_jar" \
            "$PREVIEW_URL/" --output "$home_body"
          grep -Fq 'data-catalog-guidance-state="ready"' "$home_body"
          if grep -Fqi "catalog is unavailable" "$home_body"; then
            echo "::error::Playground preview shows 'The catalog is unavailable right now.'"
            exit 1
          fi
      - name: Post playground preview comment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- playground-preview -->'
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" | head -n 1)"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ### Playground preview ready

          **[Open the playground preview](${PREVIEW_URL})**

          - [x] Published named Worker Preview \`pr-${PR_NUMBER}\`
          - [x] \`/\` redirects to \`/playground\` with HTTP 200
          - [x] \`X-Robots-Tag: noindex, nofollow\` and robots meta noindex
          - [x] Cart shows checkout as unavailable

          **Built from:** \`${SOURCE_SHA}\`

          This comment is updated in place on every push to this PR.

          [View workflow run](${RUN_URL}) · Preview: ${PREVIEW_URL}

          ${marker}
          EOF
          sed -i 's/^          //' "$body_file"
          if [ -n "$comment_id" ]; then
            url="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F "body=@${body_file}" --jq .html_url)"
          else
            url="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${body_file}" --jq .html_url)"
          fi
          echo "::notice title=Playground preview comment::${url}"
      - name: Deploy main playground
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAYGROUND_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --config dist/server/wrangler.json
          --message "${{ steps.commits.outputs.message }}"

  cleanup-playground-preview:
    name: Delete closed PR playground preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      !contains(github.event.pull_request.labels.*.name, 'verification-only') &&
      vars.PLAYGROUND_DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: playground
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAYGROUND_API_TOKEN }}
        run: >-
          pnpm exec wrangler preview delete
          --config wrangler.playground.jsonc
          --name "pr-${{ github.event.pull_request.number }}"
          --skip-confirmation
      - name: Mark playground preview comment removed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- playground-preview -->'
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" | head -n 1)"
          if [ -z "$comment_id" ]; then
            echo "No playground preview comment to update."
            exit 0
          fi
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ### Playground preview removed

          - [x] Deleted named Worker Preview \`pr-${PR_NUMBER}\` after this PR closed

          **Last built from:** \`${HEAD_SHA}\`

          ~~https://pr-${PR_NUMBER}.playground.dinkuskit.com~~ no longer serves this PR.

          [View workflow run](${RUN_URL})

          ${marker}
          EOF
          sed -i 's/^          //' "$body_file"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -F "body=@${body_file}" --jq .html_url
